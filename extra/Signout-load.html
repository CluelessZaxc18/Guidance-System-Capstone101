<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../img/fav-tab.png">
    <title>G-PATH - Signing Out</title>

    <style>
        body {
            background: url(../img/Background2.jpg) no-repeat center center fixed;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column;
            gap: 20px;
            margin: 0;
            font-family:Georgia, 'Times New Roman', Times, serif;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        body.fade-out {
            opacity: 0;
        }

        .signout-title {
            font-size: 1.6rem;
            font-weight: 600;
            color:#2195ed;
            margin: 0;
            text-shadow: 2 2px 7px rgba(0, 0, 0);
        }

        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid #f8f8f8;
            border-top: 3px solid #2372e0;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1 class="signout-title">Signing out...</h1>
    <div class="loader"></div>

    <script>
        const totalDelay = 3000;
        const fadeDuration = 500;

        setTimeout(() => {
            document.body.classList.add('fade-out');
        }, totalDelay - fadeDuration);

        setTimeout(() => {
            window.location.href = "../Login.html";
        }, totalDelay);
    </script>
    
</body>
</html>
