<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G-PATH</title>

    <style>
        body {
            background:url(img/Background2.jpg) no-repeat center center fixed;
                -webkit-background-size: cover;
                    -moz-background-size: cover;
                        -o-background-size: cover; 
                            background-size: cover;   
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column; 
            gap: 30px; /* Space between logo and loader loop */
            margin: 0;

            /* Visual dissolve timing configuration */
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        body.fade-out {
            opacity: 0;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
        }

        .G-PATH {
            width: 200px;
            height: 200px;
            margin: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Logo Section -->
    <img src="img/G-Path.svg" class="G-PATH" alt="Logo">
    
    <!-- Loader Section -->
    <div class="loader"></div>

    <!-- JavaScript Timing & Navigation Engine -->
    <script>
        // Total wait time on this page (2000ms = 2 seconds)
        const totalDelay = 4000; 
        
        // Duration of the dissolve transition (matches 0.5s in CSS)
        const fadeDuration = 500; 

        // 1. Kick off the visual dissolve right before the window switches
        setTimeout(() => {
            document.body.classList.add('fade-out');
        }, totalDelay - fadeDuration); // Starts fading at 1500ms

        // 2. Perform the physical browser redirection to Main.html
        setTimeout(() => {
            window.location.href = "Dashboard.html";
        }, totalDelay);
    </script>
    
</body>
</html>
