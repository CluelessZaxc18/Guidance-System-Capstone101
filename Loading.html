<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G-PATH</title>
    
    <!-- 1. CHEAT THE LOAD: Forces the browser to download the background image first -->
    <link rel="preload" as="image" href="img/Background.jpg">

    <style>
        body {
            /* 2. CHEAT THE FLASH: Set a dark color matching your background tone so it's not a white screen */
            background-color: #0b132b; 
            background: url(img/Background.jpg) no-repeat center center fixed;
            
            /* Prevents the image from being blurry */
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column; 
            gap: 30px;
            margin: 0;

            /* Base settings for the transition */
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        /* Triggered by JavaScript right before leaving */
        body.fade-out {
            opacity: 0;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p style="font-weight: bold; color:aqua">Loading...</p>

    <script>
        const totalDelay = 2000;  /* Total time on page: 2 seconds */
        const fadeDuration = 500; /* Fade out matches the 0.5s in CSS */

        // Start fade out at 1.5 seconds
        setTimeout(() => {
            document.body.classList.add('fade-out');
        }, totalDelay - fadeDuration);

        // Redirect to Welcome.html at 2 seconds
        setTimeout(() => {
            window.location.href = "Welcome.html";
        }, totalDelay);
    </script>
    
</body>
</html>
