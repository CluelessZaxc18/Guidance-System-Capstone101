<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Student modal fragment — not meant to be opened directly</title>
</head>
<body>

<!-- Add Student Modal -->
  <div class="as-overlay" id="addStudentOverlay">
    <div class="as-modal" role="dialog" aria-modal="true" aria-labelledby="addStudentTitle">

      <div class="as-header">
        <div class="as-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="8" r="4" stroke="white" stroke-width="2"/>
            <path d="M2 20v-1c0-2.76 3.13-5 7-5s7 2.24 7 5v1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 8v6M22 11h-6" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 id="addStudentTitle">Add New Student</h2>
      </div>

      <form id="addStudentForm">
        <div class="as-body">
          <!-- Left column -->
          <div>
            <div class="as-group">
              <label for="asFullName">Full Name</label>
              <input type="text" id="asFullName" placeholder="Enter full name" required>
            </div>

            <div class="as-group">
              <label for="asStudentId">Student ID</label>
              <input type="text" id="asStudentId" placeholder="Enter 6 digit Student ID" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
            </div>

            <div class="as-group">
              <label for="asContact">Contact Number</label>
              <input type="tel" id="asContact" pattern="[0-9]{11}" minlength="11" maxlength="11" placeholder="Enter exact 11 digits # number" required>
            </div>

            <div class="as-group">
              <label for="asStanding">Academic Standing</label>
              <input type="text" id="asStanding" pattern="[Rr][Ee][Gg][Uu][Ll][Aa][Rr]|[Ii][Rr][Rr][Ee][Gg][Uu][Ll][Aa][Rr]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr][Ee][Ee]"
                placeholder="Regular / Irregular / Transferee" required>
            </div>
          </div>

          <!-- Right column -->
          <div>
            <div class="as-group">
              <label for="asYearLevel">Year Level</label>
              <div class="as-select-wrap">
                <select id="asYearLevel">
                  <option>1st Year</option>
                  <option>2nd Year</option>
                  <option>3rd Year</option>
                  <option>4th Year</option>
                </select>
                <span class="as-chevron">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </div>
            </div>

            <div class="as-group">
              <label for="asProgram">Program</label>
              <div class="as-select-wrap">
                <select id="asProgram" required>
                  <option value="" disabled selected>Select Program</option>
                  <option>BS Criminology</option>
                  <option>BS Information Technology</option>
                  <option>BS Hospitality Management</option>
                  <option>BS Midwifery Education</option>
                  <option>BS Tourism Management</option>
                </select>
                <span class="as-chevron">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </div>
            </div>

            <div class="as-group">
              <label for="asGender">Gender</label>
              <div class="as-select-wrap">
                <select id="asGender" required>
                  <option value="" disabled selected>Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                </select>
                <span class="as-chevron">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </div>
            </div>

            <div class="as-group">
              <label for="asDob" class="as-dob-label">
                Date of Birth
              </label>
              <input type="date" id="asDob">
            </div>
          </div>
        </div>

        <div class="as-footer">
          <button type="button" class="as-btn as-btn-cancel" id="asCancelBtn">Cancel</button>
          <button type="submit" class="as-btn as-btn-save" id="asSaveBtn">Save</button>
        </div>
      </form>

    </div>
  </div>

</body>
</html>
