<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-PATH Dashboard</title>
  <link rel="stylesheet" href="css/Dashboard.css">
  <link rel="stylesheet" href="css/add-student.css">
  <link rel="stylesheet" href="css/Student.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <h1>G-PATH</h1>
        <span style="color: white;">Guidance Office</span>
      </div>
    </div>

    <nav class="navigation">
      <p class="nav-label">MAIN</p>

      <a class="nav-item" href="Dashboard.html" data-page="Dashboard">
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
      </a>

      <!-- Student dropdown -->
      <button class="nav-item active nav-dropdown" id="studentToggle" type="button" aria-expanded="false">
        <span class="nav-icon">♙</span>
        <span>Student</span>
        <span class="chevron">›</span>
      </button>

      <div class="submenu" id="studentMenu">
        <a href="#" data-page="Context 1" class="student-list1 active">Context 1</a>
        <a href="#" data-page="Context 2">Context 2</a>
      </div>

      <a class="nav-item" href="#" data-page="Document Management">
        <span class="nav-icon">▱</span>
        <span>Document Management</span>
      </a>

      <a class="nav-item" href="#" data-page="Reports">
        <span class="nav-icon">▥</span>
        <span>Reports</span>
      </a>

      <p class="nav-label lower">SYSTEM</p>

      <a class="nav-item" href="#" data-page="Settings">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-profile">
      <div class="avatar">GC</div>
      <div class="profile-info">
        <strong>Guidance Counselor</strong>
        <span>Admin</span>
      </div>
      <button class="more-btn" title="More options">Log-out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <p class="breadcrumb">G-PATH / <span id="pageName">Student</span></p>
        <h2 id="pageTitle">Student Record</h2>
      </div>

      <div class="topbar-actions">
        <button class="icon-button" id="notifBell" title="Notifications">
          <!-- Red Bell SVG -->
          <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="30" height="30" fill="#00B7FF">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1-1.5-1s-1.5.17-1.5 1v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>

          <span class="dot"></span>
        </button>
        <div class="top-profile">
          <div class="avatar small">GC</div>
          <div>
            <strong>Guidance Counselor</strong>
            <span>Admin</span>
          </div>
        </div>
      </div>
    </header>

  </main>

  <div class="toast" id="toast"></div>

  <div id="addStudentMount"></div>

  <script src="Js/Dashboard.js"></script>
  <script src="Js/add-student.js"></script>
  <script src="Js/notif.js"></script>
  <script src="Js/Overlay/logout-overlay.js"></script>
</body>
</html>
