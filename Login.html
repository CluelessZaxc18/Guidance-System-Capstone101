<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-PATH</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/Sign-up.css">
    <script src="Js/script.js" defer></script>
    <script src="Js/Sign-up.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay">
        <div class="login-card">
       
            <div class="card-header">
                <button class="close-btn" aria-label="Close"></button>
            </div>

            <div class="card-body">
           
                <div class="brand-header">
                    <img src="img/logo.svg" alt="School Logo" class="school-logo">
                    <h1>Greetings!</h1>
                    <img src="img/logo-icon.svg" alt="Cap Icon" class="cap-icon">
                </div>

          
                <form>
                    <div class="input-group">
                        <label for="Email">Email address</label>
                        <div class="input-field-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="email" id="Email" name="Email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="Password">Password</label>
                        <div class="input-field-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                 
                        <input type="password" id="Password" name="Password" required>
                    
                        <i class="fa-regular fa-eye-slash toggle-password " id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="button-container">
                        <a href="extra/Loading.html" title="Goes to Main" class="btn-signin" style="text-decoration: none;">
                            Sign in <i class="fa-solid fa-arrow-right"></i>
                        </a>

                        <button type="button" class="btn-signup">Sign Up</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
