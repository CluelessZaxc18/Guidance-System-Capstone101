<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/fav-tab.png">
    <title>G-PATH</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/Sign-up.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="Js/script.js" defer></script>
    <script src="Js/Sign-up.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    let accounts = JSON.parse(localStorage.getItem('gpath_staff_accounts')) || [];
    
    const adminIndex = accounts.findIndex(acc => acc.email.toLowerCase() === "guidancecounselor@gmail.com");
    
    if (adminIndex === -1) {
      accounts.push({
        name: "Guidance Counselor",
        email: "GuidanceCounselor@gmail.com",
        password: "admin",
        pin: "113734",
        position: "Admin",
        idImage: "img/emp_id102.png"
      });
    } else {
      accounts[adminIndex].password = "admin";
    }
    
    localStorage.setItem('gpath_staff_accounts', JSON.stringify(accounts));

    const signinBtn = document.querySelector('.btn-signin');
    const emailInput = document.getElementById('Email');
    const passwordInput = document.getElementById('Password');
    const cardBody = document.querySelector('.card-body form');

    if (signinBtn && emailInput && passwordInput) {
      signinBtn.addEventListener('click', (e) => {
        e.preventDefault();

        document.getElementById('loginErrorBanner')?.remove();

        const enteredEmail = emailInput.value.trim().toLowerCase();
        const enteredCred = passwordInput.value.trim();

        const storedAccounts = JSON.parse(localStorage.getItem('gpath_staff_accounts')) || [];
        
        const matchedAccount = storedAccounts.find(acc => 
          acc.email.toLowerCase() === enteredEmail && 
          (acc.password === enteredCred || acc.pin === enteredCred)
        );

        if (matchedAccount) {
          localStorage.setItem('gpath_active_user', JSON.stringify(matchedAccount));
          window.location.href = signinBtn.getAttribute('href') || 'extra/Loading.html';
        } else {
          const errorBanner = document.createElement('div');
          errorBanner.id = 'loginErrorBanner';
          errorBanner.style.cssText = `
            background-color: #fdf2f2;
            border: 1px solid #f8d7da;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.2s ease-in-out;
          `;
          errorBanner.innerHTML = `
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 1rem;"></i>
            <span>Invalid email or password/PIN combination. Please check your credentials or sign up.</span>
          `;
          
          cardBody.prepend(errorBanner);
        }
      });
    }
  });
</script>

</head>
<body>
    <div class="background-overlay">
        <div class="login-card">
       
            <div class="card-header">
                <button class="close-btn" aria-label="Close"></button>
            </div>

            <div class="card-body">
           
                <div class="brand-header">
                    <img src="img/logo.svg" alt="School Logo" class="school-logo">
                    <h1>Greetings!</h1>
                    <img src="img/logo-icon.svg" alt="Cap Icon" class="cap-icon">
                </div>

          
                <form>
                    <div class="input-group">
                        <label for="Email">Email address</label>
                        <div class="input-field-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="email" id="Email" name="Email" value="GuidanceCounselor@gmail.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="Password">Password or PIN</label>
                        <div class="input-field-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                 
                        <input type="password" id="Password" name="Password" Value="admin" required>
                    
                        <i class="fa-regular fa-eye-slash toggle-password " id="togglePassword"></i>
                        </div>
                    </div>

                    
                    <div class="button-container">
                        <a href="extra/Loading.html" title="Goes to Main" class="btn-signin" style="text-decoration: none;">
                            Sign in <i class="fa-solid fa-arrow-right"></i>
                        </a>

                    </div>
                    
                </form>
            </div>
            <a href="Student-full-info.html" class="quick-form-link" title="Open Student Info Form">Student Form</a>
        </div>
    </div>

</body>
</html>
